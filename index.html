<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日激励站</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-soft: #12121a;
    --card: rgba(255,255,255,0.04);
    --card-hover: rgba(255,255,255,0.07);
    --line: rgba(255,255,255,0.10);
    --gold: #e8c46a;
    --gold-soft: #f4dc9a;
    --text: #f2f0e9;
    --text-dim: #9b988e;
    --accent: #c9a55c;
    --green: #7fcfa5;
    --red: #e58a8a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(1200px 800px at 20% -10%, #1a1626 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }

  /* 顶部日期条 */
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 26px;
  }
  .today { font-size: 17px; letter-spacing: 2px; color: var(--text); }
  .today b { color: var(--gold); font-weight: 600; }
  .streak-mini { font-size: 13px; color: var(--text-dim); }

  /* 觉醒语录 */
  .quote-card {
    text-align: center; padding: 48px 36px; margin-bottom: 34px;
    background: linear-gradient(160deg, rgba(232,196,106,0.07), transparent 60%);
    border: 1px solid var(--line); border-radius: 18px; position: relative;
  }
  .quote-mark { font-size: 60px; line-height: 1; color: var(--gold); opacity: .35; font-family: Georgia, serif; position: absolute; top: 10px; left: 22px; }
  .quote-text { font-size: clamp(26px, 4.6vw, 44px); font-weight: 700; letter-spacing: 1px; line-height: 1.5; color: var(--gold-soft); min-height: 1.5em; }
  .quote-from { margin-top: 14px; font-size: 13px; color: var(--text-dim); letter-spacing: 3px; }
  .quote-actions { margin-top: 18px; display: flex; justify-content: center; gap: 14px; }
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 8px 18px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: .2s;
  }
  .btn:hover { background: var(--card-hover); border-color: var(--gold); color: var(--gold-soft); }
  .btn-primary { background: linear-gradient(135deg, #d8b45f, #b89444); color: #14100a; border: none; font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.1); color: #14100a; }

  /* 区块 */
  .section { margin-bottom: 34px; }
  .section-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; letter-spacing: 2px; margin-bottom: 14px; color: var(--text); }
  .section-title::before { content: ""; width: 4px; height: 20px; background: linear-gradient(var(--gold), var(--accent)); border-radius: 2px; }

  /* 愿景板 */
  .vision-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .vision-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    display: flex; flex-direction: column; min-height: 200px; transition: .2s;
  }
  .vision-card:hover { background: var(--card-hover); }
  .vision-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .vision-label { font-size: 14px; font-weight: 600; color: var(--gold); letter-spacing: 1px; }
  .vision-edit { font-size: 12px; color: var(--text-dim); cursor: pointer; border: none; background: none; padding: 4px 8px; border-radius: 6px; }
  .vision-edit:hover { color: var(--gold-soft); background: rgba(255,255,255,0.06); }
  .vision-body { flex: 1; font-size: 14px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .vision-body.placeholder { color: var(--text-dim); font-style: italic; }
  .vision-input {
    width: 100%; flex: 1; background: rgba(0,0,0,0.35); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 10px; font-size: 14px; resize: vertical; font-family: inherit; line-height: 1.6;
  }
  .vision-input:focus { outline: none; border-color: var(--gold); }
  .vision-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }

  /* 榜样视觉区 */
  .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .hero-cell {
    position: relative; aspect-ratio: 4/3; border-radius: 12px; overflow: hidden;
    border: 1px dashed var(--line); background: rgba(255,255,255,0.03);
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .2s;
  }
  .hero-cell:hover { border-color: var(--gold); background: rgba(255,255,255,0.05); }
  .hero-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-cell .add-hint { text-align: center; color: var(--text-dim); font-size: 13px; }
  .hero-cell .add-hint .plus { display: block; font-size: 34px; color: var(--gold); margin-bottom: 4px; }
  .hero-del {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff;
    font-size: 14px; cursor: pointer; line-height: 1; display: none; align-items: center; justify-content: center;
  }
  .hero-cell:hover .hero-del { display: flex; }
  .hero-del:hover { background: rgba(200,60,60,0.8); }
  .hero-tag { position: absolute; left: 6px; bottom: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,0.55); padding: 2px 8px; border-radius: 999px; }
  .hero-actions { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-groups { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .hero-group-tab {
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; transition: .2s;
  }
  .hero-group-tab:hover { border-color: var(--gold); color: var(--text); }
  .hero-group-tab.active { background: var(--gold); border-color: var(--gold); color: #1a150d; font-weight: 600; }
  .hero-switch {
    position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #ffd27a;
    font-size: 13px; cursor: pointer; line-height: 1; display: none; align-items: center; justify-content: center;
  }
  .hero-cell:hover .hero-switch { display: flex; }
  .hero-switch:hover { background: rgba(255,210,122,0.25); }

  /* 目标清单 */
  .goal-list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .goal-add { display: flex; gap: 10px; margin-bottom: 12px; }
  .goal-input {
    flex: 1; background: rgba(0,0,0,0.35); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 14px; font-size: 14px;
  }
  .goal-input:focus { outline: none; border-color: var(--gold); }
  .goal-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .goal-item:last-child { border-bottom: none; }
  .goal-check {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: transparent; transition: .2s;
  }
  .goal-item.done .goal-check { background: var(--green); border-color: var(--green); color: #0a0a0f; }
  .goal-text { flex: 1; font-size: 14px; word-break: break-word; }
  .goal-item.done .goal-text { text-decoration: line-through; color: var(--text-dim); }
  .goal-del { border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 15px; padding: 4px 6px; }
  .goal-del:hover { color: var(--red); }
  .goal-count { font-size: 12px; color: var(--text-dim); margin-top: 8px; }

  /* 打卡 */
  .checkin-wrap { display: grid; grid-template-columns: 1fr 1.4fr; gap: 18px; }
  @media (max-width: 760px) { .checkin-wrap { grid-template-columns: 1fr; } }
  .checkin-panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; text-align: center; }
  .checkin-btn {
    width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--gold); cursor: pointer;
    background: radial-gradient(circle at 30% 30%, rgba(232,196,106,0.25), rgba(232,196,106,0.05));
    color: var(--gold-soft); font-size: 16px; letter-spacing: 3px; font-weight: 600; transition: .3s; margin: 8px auto 16px;
  }
  .checkin-btn.done { border-color: var(--green); background: radial-gradient(circle at 30% 30%, rgba(127,207,165,0.30), rgba(127,207,165,0.08)); color: var(--green); }
  .checkin-btn:hover { transform: scale(1.04); }
  .checkin-nums { display: flex; justify-content: center; gap: 26px; margin-top: 6px; }
  .num-box .num { font-size: 30px; font-weight: 800; color: var(--gold-soft); }
  .num-box .lbl { font-size: 12px; color: var(--text-dim); }
  .cal-panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .cal-head { text-align: center; font-size: 14px; color: var(--text-dim); margin-bottom: 12px; letter-spacing: 2px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-week { text-align: center; font-size: 11px; color: var(--text-dim); padding: 4px 0; }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px;
    font-size: 13px; border: 1px solid rgba(255,255,255,0.05); color: var(--text-dim);
  }
  .cal-day.filled { background: rgba(127,207,165,0.22); border-color: rgba(127,207,165,0.5); color: var(--green); font-weight: 600; }
  .cal-day.today { border-color: var(--gold); color: var(--gold-soft); font-weight: 700; }
  .cal-day.empty { border: none; }

  /* 觉醒便签 */
  .note-add { display: flex; gap: 10px; margin-bottom: 12px; }
  .note-input {
    flex: 1; background: rgba(0,0,0,0.35); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 14px; font-size: 14px; resize: vertical; font-family: inherit;
  }
  .note-input:focus { outline: none; border-color: var(--gold); }
  .note-list { display: flex; flex-direction: column; gap: 10px; }
  .note-item {
    background: rgba(232,196,106,0.05); border: 1px solid rgba(232,196,106,0.18); border-radius: 10px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .note-text { flex: 1; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .note-time { font-size: 11px; color: var(--text-dim); flex-shrink: 0; margin-top: 3px; }
  .note-del { border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 14px; flex-shrink: 0; }
  .note-del:hover { color: var(--red); }

  .footer { text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 40px; letter-spacing: 2px; }
  .toast {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(80px);
    background: rgba(20,18,14,0.95); border: 1px solid var(--gold); color: var(--gold-soft);
    padding: 10px 22px; border-radius: 999px; font-size: 13px; opacity: 0; transition: .3s; pointer-events: none; z-index: 901;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 晨间启动页 */
  .splash {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 800px at 50% 20%, #1a1626 0%, var(--bg) 60%), var(--bg);
    transition: opacity .8s ease;
  }
  .splash-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .5; }
  .splash-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(10,10,15,.45) 0%, rgba(10,10,15,.82) 100%); }
  .splash-content { position: relative; text-align: center; padding: 40px 26px; max-width: 900px; }
  .splash-greeting { letter-spacing: 10px; font-size: 13px; color: var(--gold); margin-bottom: 26px; }
  .splash-quote { font-size: clamp(28px, 5vw, 54px); font-weight: 800; color: var(--gold-soft); line-height: 1.45; letter-spacing: 1px; }
  .splash-skip { margin-top: 40px; background: var(--card); border-color: var(--gold); color: var(--gold-soft); }
  .splash.hide { opacity: 0; pointer-events: none; }

  /* 晚间复盘 */
  .review-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .review-input-wrap { display: flex; gap: 10px; margin-bottom: 10px; }
  .review-hint { font-size: 13px; color: var(--text-dim); font-style: italic; padding: 4px 2px 10px; }

  /* 便签编辑 */
  .note-item.editing { flex-direction: column; }
  .note-edit-area { width: 100%; background: #1c1526; color: #f0e9d8; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; line-height: 1.6; resize: vertical; outline: none; }
  .note-edit-area:focus { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold-soft); }
  .note-edit-hint { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .note-edit-trigger { cursor: pointer; }
  .note-edit-trigger:hover { color: var(--gold-soft); }
  .note-editbar { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
.note-item.editing { border-color: var(--gold-soft); }
.note-save, .note-cancel { border: 1px solid transparent; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 600; letter-spacing: .5px; cursor: pointer; }
.note-save { background: linear-gradient(135deg, #d9b45f, #c9a15a); color: #1a140d; }
.note-save:hover { opacity: .9; box-shadow: 0 0 10px rgba(201,161,90,.45); }
.note-cancel { background: rgba(255,255,255,.08); color: var(--text-dim); border-color: rgba(255,255,255,.18); }
.note-cancel:hover { background: rgba(255,255,255,.15); color: #fff; }

  /* 数据诊断 */
  .diag-btn { position: fixed; right: 10px; bottom: 10px; z-index: 999; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.06); color: rgba(255,255,255,.35); border: 1px solid rgba(255,255,255,.12); font-size: 14px; line-height: 1; cursor: pointer; }
  .diag-btn:hover { color: var(--gold-soft); border-color: var(--gold); background: rgba(255,255,255,.1); }
  .diag-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .diag-panel { width: min(720px, 90vw); max-height: 80vh; background: #16101f; border: 1px solid var(--gold); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; }
  .diag-head { display: flex; justify-content: space-between; align-items: center; color: var(--gold-soft); font-weight: 600; margin-bottom: 10px; font-size: 15px; }
  .diag-head button { background: rgba(255,255,255,.08); color: var(--text-dim); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .diag-head button:hover { color: #fff; border-color: var(--gold-soft); }
  #diagBody { flex: 1; overflow: auto; white-space: pre-wrap; word-break: break-all; color: #cfc6b8; font-size: 12px; line-height: 1.6; margin: 0; }

  /* BGM 音乐库 */
  .bgm-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .bgm-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .bgm-tab { border: 1px solid var(--line); background: transparent; color: var(--text-dim); padding: 6px 16px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: .2s; letter-spacing: 1px; }
  .bgm-tab:hover { color: var(--gold-soft); border-color: var(--gold); }
  .bgm-tab.active { background: linear-gradient(135deg, #d8b45f, #b89444); color: #14100a; border-color: transparent; font-weight: 600; }
  .bgm-hint { font-size: 12px; color: var(--text-dim); font-style: italic; margin-bottom: 12px; }
  .bgm-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .bgm-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; transition: .2s; }
  .bgm-item:hover { background: var(--card-hover); border-color: rgba(255,255,255,0.18); }
  .bgm-item.playing { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(232,196,106,.35); }
  .bgm-item-info { flex: 1; min-width: 0; }
  .bgm-item-name { font-size: 14px; color: var(--text); display: block; }
  .bgm-item-input { background: #1c1526; color: #f0e9d8; border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 13px; outline: none; width: 100%; }
  .bgm-item-input:focus { border-color: var(--gold); }
  .bgm-item-tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .bgm-tag { font-size: 11px; color: var(--text-dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .bgm-tag.default { color: var(--gold); border-color: rgba(232,196,106,.45); }
  .bgm-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .bgm-abtn { background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--text-dim); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; transition: .2s; }
  .bgm-abtn:hover { color: var(--gold-soft); border-color: var(--gold); background: rgba(255,255,255,.1); }
  .bgm-abtn.danger:hover { color: var(--red); border-color: var(--red); }
  .bgm-abtn.default-on { color: var(--gold); border-color: rgba(232,196,106,.5); }
  .bgm-empty { font-size: 13px; color: var(--text-dim); padding: 14px 0; text-align: center; }
  .bgm-import-btn { width: 100%; }

  /* 启动页配乐 */
  .splash-music-btn { margin-top: 22px; background: rgba(232,196,106,0.10); border: 1px solid rgba(232,196,106,.55); color: var(--gold-soft); padding: 10px 26px; border-radius: 999px; font-size: 14px; letter-spacing: 2px; cursor: pointer; transition: .2s; }
  .splash-music-btn:hover { background: rgba(232,196,106,.22); box-shadow: 0 0 16px rgba(232,196,106,.35); }
  .splash-music-btn.playing { background: linear-gradient(135deg, #d8b45f, #b89444); color: #14100a; border-color: transparent; }
  .splash-music-hint { margin-top: 10px; font-size: 13px; color: var(--gold-soft); opacity: .85; min-height: 18px; letter-spacing: 1px; }

  /* 悬浮播放条 */
  .bgm-player { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 900; width: min(560px, 92vw); }
  .bgm-player-bar { display: flex; align-items: center; gap: 10px; background: rgba(18,18,26,0.92); border: 1px solid rgba(232,196,106,.35); border-radius: 999px; padding: 8px 14px; backdrop-filter: blur(8px); box-shadow: 0 8px 28px rgba(0,0,0,.5); }
  .bgm-pbtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); font-size: 13px; cursor: pointer; transition: .2s; flex-shrink: 0; }
  .bgm-pbtn:hover { border-color: var(--gold); color: var(--gold-soft); }
  .bgm-pbtn.bgm-play { width: 38px; height: 38px; background: linear-gradient(135deg, #d8b45f, #b89444); color: #14100a; border: none; font-size: 15px; }
  .bgm-pbtn.bgm-play:hover { filter: brightness(1.1); }
  .bgm-track { flex: 1; min-width: 0; text-align: left; padding: 0 2px; }
  .bgm-track-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bgm-scene-tag { font-size: 11px; color: var(--text-dim); }
  .bgm-vol { flex-shrink: 0; width: 84px; accent-color: #e8c46a; cursor: pointer; }
  .bgm-collapse { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--text-dim); font-size: 14px; cursor: pointer; }
  .bgm-collapse:hover { color: var(--gold-soft); border-color: var(--gold); }
  .bgm-fab { position: fixed; right: 68px; bottom: 16px; z-index: 900; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(232,196,106,.55); background: rgba(18,18,26,.95); color: var(--gold-soft); font-size: 18px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; transition: .2s; }
  .bgm-fab:hover { background: linear-gradient(135deg, #d8b45f, #b89444); color: #14100a; }
</style>
</head>
<body>
<!-- 晨间启动页 -->
<div class="splash" id="splash">
  <div class="splash-bg" id="splashBg"></div>
  <div class="splash-content">
    <div class="splash-greeting">MORNING RITUAL</div>
    <div class="splash-quote" id="splashQuote"></div>
    <button class="splash-music-btn" id="splashMusicBtn">&#9836; 开启配乐</button>
    <div class="splash-music-hint" id="splashMusicHint"></div>

<script>
(function () {
  /* ============ 全局错误捕获：任何未捕获异常在此留痕，便于定位 ============ */
  window.onerror = function (msg, src, line, col, err) {
    try {
      if (window.console && console.error) {
        console.error("[每日激励站][全局错误] " + msg + " @ " + (src || "") + ":" + line + ":" + col + (err && err.stack ? "\n" + err.stack : ""));
      }
    } catch (e) {}
    return false;
  };
  "use strict";

  /* ============ 数据工具 ============ */
  var LS = {
    get: function (k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch (e) { return d; } },
    set: function (k, v) {
      try {
        localStorage.setItem(k, JSON.stringify(v));
        return true;
      } catch (e) {
        try { if (window.console) console.warn("[每日激励站] 本地存储写入失败:", k, e && e.name); } catch (ignore) {}
        return false;
      }
    }
  };

  /* ============ 数据兼容与迁移 ============ */
  // 主 key 与历史版本/常见备份命名候选 key；优先读主 key，为空则尝试旧 key 并迁移
  var KEY_ALIASES = {
    vision: ["vision", "visionBoard", "vision_v1"],
    goals: ["goals", "dailyGoals", "goals_v1"],
    checkins: ["checkins", "checkinDates", "checkins_v1"],
    notes: ["notes", "awakenNotes", "notes_v1"],
    heroes: ["heroes", "heroImages", "heroes_v1"],
    quoteOffset: ["quoteOffset", "quoteIndex"]
  };
  function loadWithFallback(key, def) {
    var aliases = KEY_ALIASES[key] || [key];
    var i, raw, val;
    for (i = 0; i < aliases.length; i++) {
      try {
        raw = localStorage.getItem(aliases[i]);
        if (raw === null) continue;
        val = JSON.parse(raw);
      } catch (e) { continue; }
      // 空形态（空数组/空对象/空串）不作为终点：继续向后找有真实数据的候选，
      // 避免「主 key 存在空默认值 → 覆盖了候选中的真实旧数据」导致旧数据不显示。
      if (i === aliases.length - 1 || !isEmptyish(val)) break;
    }
    if (i >= aliases.length) return def;
    if (aliases[i] !== key) {
      try {
        localStorage.setItem(key, raw);
        try { localStorage.removeItem(aliases[i]); } catch (ignore) {}
        try { if (window.console) console.log("[每日激励站] 数据迁移:", aliases[i], "->", key); } catch (ignore) {}
      } catch (e) {}
    }
    return val;
  }

  function isEmptyish(v) {
    if (v === null || v === undefined) return true;
    if (Array.isArray(v)) return v.length === 0;
    if (typeof v === "object") return Object.keys(v).length === 0;
    return v === "";
  }

  /* ============ 结构规范化：兼容历史变体结构，转换后回写主 key ============ */
  function normalizeVision(v) {
    if (!v || typeof v !== "object") v = {};
    if (Array.isArray(v)) { // 极老版本数组形式 [future, place, people]
      var arr = v;
      v = { future: arr[0] || "", place: arr[1] || "", people: arr[2] || "" };
    }
    if (typeof v.future === "undefined" && typeof v.life === "string") v.future = v.life;
    if (typeof v.place === "undefined" && typeof v.space === "string") v.place = v.space;
    if (typeof v.people === "undefined" && typeof v.person === "string") v.people = v.person;
    ["future", "place", "people"].forEach(function (k) {
      if (typeof v[k] !== "string") v[k] = "";
    });
    return v;
  }
  function normalizeGoals(g) {
    if (!Array.isArray(g)) {
      if (g && typeof g === "object" && g.text) g = [g];
      else if (typeof g === "string" && g.trim()) g = [{ text: g, done: false }];
      else g = [];
    }
    return g.filter(function (x) { return x && typeof x === "object"; })
      .map(function (x) {
        var done = !!x.done;
        if (typeof x.completed === "boolean" && typeof x.done === "undefined") done = x.completed;
        return { text: String(x.text === undefined ? "" : x.text), done: done };
      })
      .filter(function (x) { return x.text; });
  }
  function normalizeCheckins(c) {
    if (!Array.isArray(c)) {
      if (c && typeof c === "object" && !Array.isArray(c)) { // 对象集合 { "2026-10-01": true }
        c = Object.keys(c).filter(function (k) { return !!c[k]; });
      } else c = [];
    }
    var out = [];
    c.forEach(function (k) {
      var s = null;
      if (typeof k === "string") s = k;
      else if (typeof k === "number" && isFinite(k)) { // 数字时间戳 → 本地日期
        var d = new Date(k);
        s = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      } else if (k && typeof k === "object" && k.date) s = k.date;
      if (s && out.indexOf(s) === -1) out.push(s);
    });
    return out.sort();
  }
  function normalizeNotes(n) {
    if (!Array.isArray(n)) {
      if (n && typeof n === "object" && n.text) n = [n];
      else if (typeof n === "string" && n.trim()) n = [{ text: n, time: "" }];
      else n = [];
    }
    return n.filter(function (x) { return x && typeof x === "object"; })
      .map(function (x) {
        return { text: String(x.text === undefined ? "" : x.text), time: String(x.time === undefined ? "" : x.time) };
      })
      .filter(function (x) { return x.text; });
  }
  function normalizeHeroes(h) {
    if (!Array.isArray(h)) {
      if (h && typeof h === "object" && h.src) h = [h];
      else if (typeof h === "string" && h) h = [{ src: h, tag: "榜样" }];
      else h = [];
    }
    return h.filter(function (x) { return x && typeof x === "object"; })
      .map(function (x) {
        return { src: String(x.src === undefined ? "" : x.src), tag: String(x.tag === undefined ? "榜样" : x.tag), group: x.group === "jiamu" ? "jiamu" : "other" };
      })
      .filter(function (x) { return x.src; });
  }
  function finalizeData(key, val, norm) {
    var nv = norm(val);
    try {
      var raw = localStorage.getItem(key);
      if (raw === null || JSON.stringify(nv) !== raw) localStorage.setItem(key, JSON.stringify(nv));
    } catch (e) {}
    return nv;
  }

  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  /* ============ 日期 ============ */
  var WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  var now = new Date();

  document.getElementById("todayFull").textContent = todayFull;

  /* ============ 觉醒语录 ============ */

    { t: "执行力是最高级的自律。想，全是问题；做，才有答案。", f: "" },

  function daySeed() {
    var d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }

  function renderQuote() {
    var off = loadWithFallback("quoteOffset", 0);
    var idx = ((daySeed() + off) % QUOTES.length + QUOTES.length) % QUOTES.length;
    var q = QUOTES[idx];
    document.getElementById("quoteText").textContent = q.t;
    document.getElementById("quoteFrom").textContent = q.f ? "—— " + q.f : "";
  }

  document.getElementById("quotePrev").addEventListener("click", function () {
    LS.set("quoteOffset", LS.get("quoteOffset", 0) - 1);
    renderQuote();
  });
  document.getElementById("quoteNext").addEventListener("click", function () {
    LS.set("quoteOffset", LS.get("quoteOffset", 0) + 1);
    renderQuote();
  });

  /* ============ 愿景板 ============ */
  var VISION_DEFS = [
    { key: "future", label: "未来生活状态", placeholder: "写下你期盼的生活状态…\n例：每天 6 点起床，身材紧致，财务自由，谈吐从容。" },

  ];
  var visionData = finalizeData("vision", loadWithFallback("vision", {}), normalizeVision);
  var visionGrid = document.getElementById("visionGrid");

  function renderVision() {
    visionGrid.innerHTML = "";
    VISION_DEFS.forEach(function (def) {
      var card = document.createElement("div");
      card.className = "vision-card";
      var val = visionData[def.key] || "";
      card.innerHTML =
        '<div class="vision-head">' +
        '  <div class="vision-label">' + def.label + '</div>' +
        '  <button class="vision-edit">编辑</button>' +
        '</div>' +
        '<div class="vision-body' + (val ? "" : " placeholder") + '" data-key="' + def.key + '">' +
        (val ? escapeHtml(val) : def.placeholder.split("\n")[0]) +
        '</div>';
      visionGrid.appendChild(card);
    });
  }

  visionGrid.addEventListener("click", function (e) {
    var editBtn = e.target.closest(".vision-edit");
    if (!editBtn) return;
    var card = editBtn.closest(".vision-card");
    var key = card.querySelector(".vision-body").getAttribute("data-key");
    var def = VISION_DEFS.find(function (d) { return d.key === key; });

      '<div class="vision-head">' +
      '  <div class="vision-label">' + def.label + '</div>' +
      '  <button class="vision-edit" style="opacity:.4">编辑</button>' +
      '</div>' +
      '<textarea class="vision-input" placeholder="' + def.placeholder + '">' + (visionData[key] || "") + '</textarea>' +
      '<div class="vision-actions">' +
      '  <button class="btn vision-save" style="padding:5px 14px">保存</button>' +
      '  <button class="btn vision-cancel" style="padding:5px 14px">取消</button>' +
      '</div>';

  });

  visionGrid.addEventListener("click", function (e) {

    var key = input.closest(".vision-card").querySelector(".vision-body") ? "" : "";

    var label = card.querySelector(".vision-label").textContent;
    var def = VISION_DEFS.find(function (d) { return d.label === label; });

      visionData[def.key] = input.value.trim();
      LS.set("vision", visionData);

  });

  /* ============ 榜样视觉区 ============ */
  var heroes = finalizeData("heroes", loadWithFallback("heroes", []), normalizeHeroes);

  function renderHeroes() {

    return { streak: streak, total: checkins.length };

  /* ============ BGM 音乐库（IndexedDB 存音频 blob + localStorage 存元数据） ============ */
  var BGM_SCENES = [
    { key: "feel", name: "爽感启动" },
    { key: "focus", name: "专注工作" },
    { key: "sleep", name: "睡前复盘" }
  ];
  function bgmSceneName(key) {
    for (var i = 0; i < BGM_SCENES.length; i++) if (BGM_SCENES[i].key === key) return BGM_SCENES[i].name;
    return "爽感启动";

  var bgmList = LS.get("bgmList", []); // [{id, name, scene, isDefault}]
  var bgmCurScene = "feel";
  var bgmEditingId = null;

  // IndexedDB：库 dailyInspireDB / 存储 bgm / keyPath=id
  var bgmDB = (function () {
    var db = null;
    var opening = null;
    try {
      if (window.indexedDB) opening = window.indexedDB.open("dailyInspireDB", 1);
    } catch (e) { opening = null; }
    if (opening) {
      opening.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains("bgm")) d.createObjectStore("bgm", { keyPath: "id" });
      };
      opening.onsuccess = function () { db = opening.result; };
      opening.onerror = function () { db = null; };
    }
    function withDb(cb) {
      if (db) { cb(db); return; }
      if (!opening) { cb(null); return; }
      if (opening.readyState === "done") { db = opening.result; cb(db); return; }
      opening.onsuccess = function () { db = opening.result; cb(db); };
      opening.onerror = function () { db = null; cb(null); };
    }
    function put(id, blob, cb) {
      withDb(function (d) {
        if (!d) { cb && cb(false); return; }
        try {
          var tx = d.transaction("bgm", "readwrite");
          tx.objectStore("bgm").put({ id: id, blob: blob });
          tx.oncomplete = function () { cb && cb(true); };
          tx.onerror = function () { cb && cb(false); };
        } catch (e) { cb && cb(false); }
      });
    }
    function get(id, cb) {
      withDb(function (d) {
        if (!d) { cb && cb(null); return; }
        try {
          var rq = d.transaction("bgm").objectStore("bgm").get(id);
          rq.onsuccess = function () { cb && cb(rq.result ? rq.result.blob : null); };
          rq.onerror = function () { cb && cb(null); };
        } catch (e) { cb && cb(null); }
      });
    }
    function del(id, cb) {
      withDb(function (d) {
        if (!d) { cb && cb(); return; }
        try {
          var tx = d.transaction("bgm", "readwrite");
          tx.objectStore("bgm").delete(id);
          tx.oncomplete = function () { cb && cb(); };
          tx.onerror = function () { cb && cb(); };
        } catch (e) { cb && cb(); }
      });
    }
    return { put: put, get: get, del: del };
  })();

  // 播放器状态（跨模块/跨页面跳转保持；刷新后默认不自动播放）
  var bgmPlayer = {
    audio: null,
    currentId: null,
    currentScene: "feel",
    lastScene: "feel",
    playing: false,
    volume: 0.8,
    objectUrl: null
  };

  function bgmAudio() {
    if (!bgmPlayer.audio) {
      bgmPlayer.audio = new Audio();
      bgmPlayer.audio.volume = bgmPlayer.volume;
      bgmPlayer.audio.addEventListener("ended", function () { bgmStep(1); });
      bgmPlayer.audio.addEventListener("error", function () {
        if (bgmPlayer.currentId) bgmStop("这首音乐无法播放（文件可能已丢失或格式不支持）");
      });
    }
    return bgmPlayer.audio;
  }

  function bgmSaveList() { LS.set("bgmList", bgmList); }
  function bgmById(id) { for (var i = 0; i < bgmList.length; i++) if (bgmList[i].id === id) return bgmList[i]; return null; }
  function bgmSceneTracks(scene) { return bgmList.filter(function (m) { return m.scene === scene; }); }
  function bgmDefaultTrack() { for (var i = 0; i < bgmList.length; i++) if (bgmList[i].isDefault) return bgmList[i]; return null; }

  function bgmPlayTrack(id, scene) {
    var m = bgmById(id);
    if (!m) { bgmStop("这首音乐已不在 BGM 库"); return; }
    bgmPlayer.currentId = id;
    if (scene) bgmPlayer.currentScene = scene;
    bgmDB.get(id, function (blob) {
      if (!blob) { bgmStop("这首音乐文件已丢失，请重新导入"); return; }
      var a = bgmAudio();
      var url;
      try { url = URL.createObjectURL(blob); } catch (e) { bgmStop("浏览器不支持播放此音乐"); return; }
      if (bgmPlayer.objectUrl) { try { URL.revokeObjectURL(bgmPlayer.objectUrl); } catch (e) {} }
      bgmPlayer.objectUrl = url;
      a.src = url;
      var p = a.play();
      if (p && p.then) {
        p.then(function () {
          bgmPlayer.playing = true;
          bgmUpdatePlayerUI();
          bgmRenderList();
        }).catch(function () {
          bgmPlayer.playing = false;
          bgmUpdatePlayerUI();
          bgmRenderList();
          toast("播放被浏览器拦截，请再点一次播放");
        });
      } else {
        bgmPlayer.playing = true;
        bgmUpdatePlayerUI();
        bgmRenderList();
      }
    });
  }

  function bgmStop(hint) {
    try {
      if (bgmPlayer.audio) {
        bgmPlayer.audio.pause();
        bgmPlayer.audio.removeAttribute("src");
        try { bgmPlayer.audio.load(); } catch (e) {}
      }
    } catch (e) {}
    if (bgmPlayer.objectUrl) { try { URL.revokeObjectURL(bgmPlayer.objectUrl); } catch (e) {} }
    bgmPlayer.objectUrl = null;
    bgmPlayer.playing = false;
    bgmPlayer.currentId = null;
    if (hint) toast(hint);
    bgmUpdatePlayerUI();
    bgmRenderList();
  }

  function bgmStep(dir) {
    var tracks = bgmSceneTracks(bgmPlayer.currentScene);
    if (!tracks.length) { toast("这个场景还没有音乐，先去 BGM 库导入吧"); return; }
    var idx = 0;
    for (var i = 0; i < tracks.length; i++) if (tracks[i].id === bgmPlayer.currentId) { idx = i; break; }
    idx = (idx + dir + tracks.length) % tracks.length;
    bgmPlayTrack(tracks[idx].id, bgmPlayer.currentScene);
  }

  function bgmTogglePlay() {
    if (bgmPlayer.playing) {
      try { bgmPlayer.audio.pause(); } catch (e) {}
      bgmPlayer.playing = false;
      bgmUpdatePlayerUI();
      return;
    }
    if (bgmPlayer.currentId) {
      var p = bgmAudio().play();
      if (p && p.then) p.then(function () { bgmPlayer.playing = true; bgmUpdatePlayerUI(); }).catch(function () { toast("播放被浏览器拦截，请再点一次"); });
      else { bgmPlayer.playing = true; bgmUpdatePlayerUI(); }
      return;
    }
    var d = bgmDefaultTrack();
    if (d) { bgmPlayTrack(d.id, d.scene); return; }
    var t = bgmSceneTracks(bgmCurScene);
    if (t.length) { bgmPlayTrack(t[0].id, bgmCurScene); return; }
    toast("BGM 库还没有音乐，先导入一首吧");
  }

  function bgmUpdatePlayerUI() {
    var bar = document.getElementById("bgmPlayer");
    var fab = document.getElementById("bgmFab");
    var playBtn = document.getElementById("bgmPlayBtn");
    var nameEl = document.getElementById("bgmTrackName");
    var tagEl = document.getElementById("bgmSceneTag");
    var volEl = document.getElementById("bgmVol");
    if (playBtn) playBtn.innerHTML = bgmPlayer.playing ? "&#10074;&#10074;" : "&#9654;";
    if (bar) bar.style.display = bgmPlayer.collapsed ? "none" : "block";
    if (fab) fab.style.display = bgmPlayer.collapsed ? "flex" : "none";
    var m = bgmPlayer.currentId ? bgmById(bgmPlayer.currentId) : null;
    if (nameEl) nameEl.textContent = m ? m.name : "未播放";
    if (tagEl) tagEl.textContent = m ? bgmSceneName(m.scene) : "";
    if (volEl) volEl.value = String(bgmPlayer.volume);
  }

  function bgmSetCollapsed(c) {
    bgmPlayer.collapsed = c;
    bgmUpdatePlayerUI();
  }

  function bgmRenderTabs() {
    var tabsEl = document.getElementById("bgmTabs");
    if (!tabsEl) return;
    var btns = tabsEl.querySelectorAll(".bgm-tab");
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = "bgm-tab" + (btns[i].getAttribute("data-scene") === bgmCurScene ? " active" : "");
    }
  }

  function bgmRenderList() {
    var listEl = document.getElementById("bgmList");
    var emptyEl = document.getElementById("bgmEmpty");
    if (!listEl) return;
    var tracks = bgmSceneTracks(bgmCurScene);
    listEl.innerHTML = "";
    if (emptyEl) emptyEl.style.display = tracks.length ? "none" : "block";
    tracks.forEach(function (m) {
      var item = document.createElement("div");
      item.className = "bgm-item" + (bgmPlayer.currentId === m.id ? " playing" : "");
      item.setAttribute("data-id", m.id);
      var tags = "";
      if (m.isDefault) tags += '<span class="bgm-tag default">启动默认</span>';
      tags += '<span class="bgm-tag">' + bgmSceneName(m.scene) + "</span>";
      var actions =
        '<button class="bgm-abtn" data-act="play" title="播放/试听">&#9654;</button>' +
        '<button class="bgm-abtn" data-act="rename" title="重命名">&#9998;</button>' +
        '<button class="bgm-abtn' + (m.isDefault ? " default-on" : "") + '" data-act="default" title="设为启动默认">&#9733; ' + (m.isDefault ? "已默认" : "设默认") + "</button>" +
        '<button class="bgm-abtn danger" data-act="del" title="删除">&#10005;</button>';
      item.innerHTML =
        '<div class="bgm-item-info"><span class="bgm-item-name">' + escapeHtml(m.name) + '</span>' +
        '<div class="bgm-item-tags">' + tags + "</div></div>" +
        '<div class="bgm-item-actions">' + actions + "</div>";
      listEl.appendChild(item);
    });
  }

  function bgmStartRename(id) {
    var m = bgmById(id);
    if (!m) return;
    bgmEditingId = id;
    bgmRenderList();
    var listEl = document.getElementById("bgmList");
    var itemEl = listEl ? listEl.querySelector('[data-id="' + id + '"]') : null;
    var nameEl = itemEl ? itemEl.querySelector(".bgm-item-name") : null;
    if (!nameEl) return;
    var input = document.createElement("input");
    input.className = "bgm-item-input";
    input.value = m.name;
    input.maxLength = 40;
    nameEl.innerHTML = "";
    nameEl.appendChild(input);
    input.focus();
    input.select();
    var done = false;
    function commit() {
      if (done) return;
      done = true;
      var v = input.value.trim();
      if (v && v !== m.name) {
        m.name = v;
        bgmSaveList();
        toast("已重命名为《" + v + "》");
      }
      bgmEditingId = null;
      bgmRenderList();
      bgmUpdatePlayerUI();
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      if (e.key === "Escape") { done = true; bgmEditingId = null; bgmRenderList(); }
    });
    input.addEventListener("blur", commit);
  }

  function bgmSetDefault(id) {
    var m = bgmById(id);
    if (!m) return;
    bgmList.forEach(function (x) { x.isDefault = (x.id === id); });
    bgmSaveList();
    bgmRenderList();
    bgmUpdatePlayerUI();
    toast("已设为启动默认");
  }

  function bgmDelete(id) {
    var m = bgmById(id);
    if (!m) return;
    if (!window.confirm("确定删除《" + m.name + "》？")) return;
    bgmDB.del(id);
    bgmList = bgmList.filter(function (x) { return x.id !== id; });
    bgmSaveList();
    if (bgmPlayer.currentId === id) bgmStop(null);
    bgmRenderList();
    bgmUpdatePlayerUI();
    toast("已删除《" + m.name + "》");
  }

  function bgmImportFiles(files) {
    var list = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (f && f.type && f.type.indexOf("audio/") === 0) list.push(f);
    }
    if (!list.length) { toast("没有识别到音频文件"); return; }
    var idx = 0;
    var okCount = 0;
    function next() {
      if (idx >= list.length) {
        if (okCount > 0) { bgmSaveList(); bgmRenderList(); toast("已导入 " + okCount + " 首音乐"); }
        else toast("导入失败：浏览器不支持存储音频");
        return;
      }
      var f = list[idx++];
      var id = "bgm" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
      var rawName = f.name || "未命名音乐";
      var name = rawName.replace(/\.[^.]+$/, "").trim() || "未命名音乐";
      bgmDB.put(id, f, function (ok) {
        if (ok) {
          bgmList.push({ id: id, name: name, scene: bgmCurScene, isDefault: false });
          okCount++;
        }
        next();
      });
    }
    next();
  }

  function bgmInitAll() {
    var tabsEl = document.getElementById("bgmTabs");
    var listEl = document.getElementById("bgmList");
    var importBtn = document.getElementById("bgmImportBtn");
    var bgmFile = document.getElementById("bgmFile");

    if (tabsEl) tabsEl.addEventListener("click", function (e) {
      var t = e.target;
      if (t && t.getAttribute && t.getAttribute("data-scene")) {
        bgmCurScene = t.getAttribute("data-scene");
        bgmRenderTabs();
        bgmRenderList();
      }
    });

    if (listEl) listEl.addEventListener("click", function (e) {
      var btn = e.target;
      var item = btn && btn.parentNode ? btn.parentNode.parentNode : null;
      if (!btn || !btn.getAttribute) return;
      var act = btn.getAttribute("data-act");
      var id = item ? item.getAttribute("data-id") : null;
      if (!id || !act) return;
      var m = bgmById(id);
      if (!m) return;
      if (act === "play") { bgmPlayTrack(m.id, m.scene); }
      else if (act === "rename") { if (bgmEditingId) return; bgmStartRename(m.id); }
      else if (act === "default") { bgmSetDefault(m.id); }
      else if (act === "del") { bgmDelete(m.id); }
    });

    if (importBtn && bgmFile) {
      importBtn.addEventListener("click", function () { bgmFile.click(); });
      bgmFile.addEventListener("change", function () {
        if (bgmFile.files && bgmFile.files.length) bgmImportFiles(bgmFile.files);
        bgmFile.value = "";
      });
    }

    var prevBtn = document.getElementById("bgmPrevBtn");
    var playBtn = document.getElementById("bgmPlayBtn");
    var nextBtn = document.getElementById("bgmNextBtn");
    var volEl = document.getElementById("bgmVol");
    var collapseBtn = document.getElementById("bgmCollapseBtn");
    var fab = document.getElementById("bgmFab");
    if (prevBtn) prevBtn.addEventListener("click", function () { bgmStep(-1); });
    if (nextBtn) nextBtn.addEventListener("click", function () { bgmStep(1); });
    if (playBtn) playBtn.addEventListener("click", bgmTogglePlay);
    if (volEl) volEl.addEventListener("input", function () {
      var v = parseFloat(volEl.value);
      if (!isNaN(v)) {
        bgmPlayer.volume = v;
        if (bgmPlayer.audio) { try { bgmPlayer.audio.volume = v; } catch (e) {} }
      }
    });
    if (collapseBtn) collapseBtn.addEventListener("click", function () { bgmSetCollapsed(true); });
    if (fab) fab.addEventListener("click", function () { bgmSetCollapsed(false); });

    bgmRenderTabs();
    bgmRenderList();
    bgmUpdatePlayerUI();
  }

  /* ============ 启动页配乐 ============ */
  function bgmSplashInit() {
    var btn = document.getElementById("splashMusicBtn");
    var hint = document.getElementById("splashMusicHint");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var d = bgmDefaultTrack();
      if (!d) {
        if (hint) { hint.textContent = "先在 BGM 库设置一首启动默认音乐吧"; setTimeout(function () { hint.textContent = ""; }, 2600); }
        return;
      }
      bgmPlayTrack(d.id, d.scene);
      btn.textContent = "&#9836; 配乐播放中";
      btn.classList.add("playing");
    });
  }

  /* ============ 晚间复盘配乐联动（进入晚间复盘自动切「睡前复盘」场景） ============ */
  function bgmSceneWatchInit() {
    var sec = document.getElementById("reviewSection");
    if (!sec || !window.IntersectionObserver) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!bgmPlayer.playing || !bgmPlayer.currentId) return;
        if (en.isIntersecting) {
          var sleepTracks = bgmSceneTracks("sleep");
          if (!sleepTracks.length) return;
          if (bgmPlayer.currentScene !== "sleep") {
            bgmPlayer.lastScene = bgmPlayer.currentScene;
            bgmPlayTrack(sleepTracks[0].id, "sleep");
          }
        } else {
          if (bgmPlayer.currentScene === "sleep") {
            var back = bgmSceneTracks(bgmPlayer.lastScene);
            if (back.length) bgmPlayTrack(back[0].id, bgmPlayer.lastScene);
          }
        }
      });
    }, { threshold: 0.25 });
    io.observe(sec);
  }

  function collectDiag() {
    var lines = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        var raw = localStorage.getItem(k);
        var parsed = null;
        try { parsed = JSON.parse(raw); } catch (e) { parsed = "(非JSON) " + raw; }
        lines.push("◆ " + k + "\n" + JSON.stringify(parsed, null, 2));
      }
    } catch (e) { lines.push("读取 localStorage 失败: " + e); }
    return lines.length ? lines.join("\n\n") : "(localStorage 为空)";
  }

      { text: "面对无法改变的困境，我们宁愿自由的选择一种有尊严的生活。", time: "9999/02/29 28" },
      { text: "我们是从书中得到力量，然后，对我们这个世界有所作为。去经历更多与更多人相遇，去面对不可胜数的机遇。", time: "9999/02/29 28" },
      { text: "比如伟大的共产主义社会，每个人的自由发展是一切人自由发展的条件。", time: "9999/02/29 28" },
      { text: "习惯决定绩效。", time: "9999/02/29 28" },
      { text: "若我记定、自便觉见，若我记定，你便觉空。", time: "9999/02/29 24" }
    ]
  };
  // 仅当 key 为空或无有效用户数据（空对象/空数组/空串）时写入种子；否则以已有数据为准
  function seedIfEmpty(key, seedValue) {
    var cur = LS.get(key, null);
    if (cur === null || isEmptyish(cur)) {
      if (LS.set(key, seedValue)) return true;
    }
    return false;
  }
  var seededVision = seedIfEmpty("vision", SEED_DATA.vision);
  var seededGoals = seedIfEmpty("goals", SEED_DATA.goals);
  var seededNotes = seedIfEmpty("notes", SEED_DATA.notes);
  if (seededVision || seededGoals || seededNotes) {
    // 走现有 normalize 兼容层重新读取并回写，随后刷新界面渲染
    visionData = finalizeData("vision", loadWithFallback("vision", {}), normalizeVision);
    goals = finalizeData("goals", loadWithFallback("goals", []), normalizeGoals);
    notes = finalizeData("notes", loadWithFallback("notes", []), normalizeNotes);
    safeInit("愿景板", renderVision);
    safeInit("今日目标", renderGoals);
    safeInit("觉醒便签", renderNotes);
    try {
      if (window.console) console.log("[每日激励站] 数据恢复种子已写入:", ["vision", "goals", "notes"].filter(function (k) {
        return (k === "vision" && seededVision) || (k === "goals" && seededGoals) || (k === "notes" && seededNotes);
      }).join(","));
    } catch (e) {}
  }
})();
</script>
<script>
/* 启动页兜底：主脚本任何模块异常导致 initSplash 未执行时，仍保证「立即进入」可用与 3 秒自动进入 */
(function () {
  try {
    var sp = document.getElementById("splash");
    var skip = document.getElementById("splashSkip");
    if (!sp) return;
    var done = false;
    function hide() {
      if (done) return;
      done = true;
      sp.classList.add("hide");
      setTimeout(function () { sp.style.display = "none"; }, 800);
    }
    if (skip) skip.addEventListener("click", hide);
    setTimeout(hide, 3000);
  } catch (e) {}
})();
</script>
